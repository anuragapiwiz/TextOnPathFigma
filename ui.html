<h2>Figma Plugin</h2>
<div>
  <p>Selected Text: <span id="text-name"></span></p>
  <p>Selected Shape: <span id="shape-name"></span></p>
</div>
<div>
  <button id="text-on-path">Text on Path</button>
</div>
<div>
  <label for="spacing-slider">Letter Spacing:</label>
  <input type="range" id="spacing-slider" min="0" max="100" value="0">
</div>

<script>
  document.getElementById('text-on-path').onclick = () => {
    parent.postMessage({ pluginMessage: { type: 'text-on-path' } }, '*')
  }
  document.getElementById('spacing-slider').oninput = (event) => {
    const spacing = parseInt(event.target.value, 10);
    parent.postMessage({ pluginMessage: { type: 'update-spacing', spacing } }, '*');
  }
}
</script>
